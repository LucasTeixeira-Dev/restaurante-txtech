version: '3.9'

services:
  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: restaurante_backend
    restart: unless-stopped
    working_dir: /var/www
    volumes:
      - ./backend:/var/www
    ports:
      - "8000:8000"
    environment:
      - APP_ENV=local
      - APP_DEBUG=true
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_healthy
    networks:
      - restaurante_net
    command: php artisan serve --host=0.0.0.0 --port=8000

  web:
    build:
      context: ./frontend/web
      dockerfile: Dockerfile
    container_name: restaurante_web
    restart: unless-stopped
    ports:
      - "3000:3000"
    volumes:
      - ./frontend/web:/app
      - /app/node_modules
    environment:
      - VITE_API_URL=http://localhost:8000/api/v1
    depends_on:
      - backend
    networks:
      - restaurante_net

  db:
    image: mysql:8.0
    container_name: restaurante_db
    restart: unless-stopped
    ports:
      - "3306:3306"
    environment:
      MYSQL_DATABASE: restaurante_txtech
      MYSQL_USER: txtech
      MYSQL_PASSWORD: secret
      MYSQL_ROOT_PASSWORD: root_secret
    volumes:
      - mysql_data:/var/lib/mysql
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost", "-u", "txtech", "-psecret"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - restaurante_net

  redis:
    image: redis:7-alpine
    container_name: restaurante_redis
    restart: unless-stopped
    ports:
      - "6379:6379"
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - restaurante_net

  mailpit:
    image: axllent/mailpit:latest
    container_name: restaurante_mailpit
    restart: unless-stopped
    ports:
      - "8025:8025"
      - "1025:1025"
    networks:
      - restaurante_net

volumes:
  mysql_data:
  redis_data:

networks:
  restaurante_net:
    driver: bridge
